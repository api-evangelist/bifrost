aid: bifrost
name: Bifrost
description: Bifrost is a high-performance open-source AI gateway that unifies access to 20+ AI providers through a single
  OpenAI-compatible API. It supports 1,000+ models with adaptive load balancing, automatic failover, semantic caching, and
  enterprise observability features. Bifrost is open-source under Apache 2.0.
