openapi: 3.2.0
info:
  title: Bifrost HTTP Transport MCP Tools API
  description: 'A unified HTTP API for accessing multiple AI model providers:


    • openai

    • anthropic

    • azure

    • bedrock

    • cohere

    • vertex

    • mistral

    • ollama

    • groq

    • sgl


    Bifrost provides:


    **Core Features:**

    • Standardized **OpenAI Compatible** endpoints for text and chat completions

    • Built-in fallback support across providers

    • Comprehensive monitoring and logging

    • Real-time WebSocket streaming


    **Audio Processing:**

    • Speech synthesis (text-to-speech) with multiple voices and formats

    • Audio transcription (speech-to-text) with timing information

    • Streaming support for both speech and transcription

    • OpenAI-compatible audio endpoints


    **MCP Integration:**

    • Model Context Protocol (MCP) support for external tool integration

    • Dynamic MCP client management (add/remove/edit clients)

    • STDIO, HTTP, and SSE connection types

    • Automatic tool discovery and execution


    **Management APIs:**

    • Provider configuration management (CRUD operations)

    • System configuration hot-reloading

    • Application logs with advanced filtering

    • Dropped request monitoring


    **Integration Endpoints:**

    • OpenAI-compatible: `/openai/chat/completions`, `/openai/audio/speech`, `/openai/audio/transcriptions`

    • Anthropic-compatible: `/anthropic/v1/messages`

    • Google Gemini-compatible: `/genai/v1beta/models/{model}`

    • LiteLLM-compatible: `/chat/completions`'
  version: 1.1.2
  contact:
    name: Bifrost API Support
    url: https://github.com/maximhq/bifrost
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
- url: http://localhost:8080
  description: Local development server
tags:
- name: MCP Tools
  description: Execute MCP tools
paths:
  /v1/mcp/tool/execute:
    post:
      summary: Execute MCP Tool
      description: Executes an MCP (Model Context Protocol) tool that has been configured in Bifrost. This endpoint is used to execute tool calls returned by AI models during conversations. Requires MCP to be configured in Bifrost.
      operationId: executeMCPTool
      tags:
      - MCP Tools
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolCall'
            examples:
              google_search:
                summary: Google Search Tool Execution
                value:
                  type: function
                  id: toolu_01VfefsSy7ZRdawdw7U2fg
                  function:
                    name: google_search
                    arguments: '{"gl":"us","hl":"en","num":5,"q":"San Francisco news yesterday","tbs":"qdr:d"}'
              file_read:
                summary: File Read Tool Execution
                value:
                  type: function
                  id: call_abc123
                  function:
                    name: read_file
                    arguments: '{"path": "/tmp/config.json"}'
      responses:
        '200':
          description: Tool execution successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BifrostMessage'
              examples:
                search_result:
                  summary: Google Search Result
                  value:
                    role: tool
                    content: "{\n  \"searchParameters\": {\n    \"q\": \"San Francisco news yesterday\",\n    \"gl\": \"us\",\n    \"hl\": \"en\",\n    \"type\": \"search\",\n    \"num\": 5,\n    \"tbs\": \"qdr:d\",\n    \"engine\": \"google\"\n  },\n  \"organic\": [\n    {\n      \"title\": \"San Francisco Chronicle · Giants' today\"\n    },\n    {\n      \"query\": \"s.f. chronicle e edition\"\n    }\n  ],\n  \"credits\": 1\n}"
                    tool_call_id: toolu_01VfefsSy7ZRdawdw7U2fg
                file_content:
                  summary: File Read Result
                  value:
                    role: tool
                    content: "{\n  \"provider\": \"openai\",\n  \"model\": \"gpt-4o-mini\",\n  \"api_key\": \"sk-***\"\n}"
                    tool_call_id: call_abc123
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  schemas:
    ImageURLStruct:
      type: object
      required:
      - url
      properties:
        url:
          type: string
          description: Image URL or data URI
          example: https://example.com/image.jpg
        detail:
          type: string
          enum:
          - low
          - high
          - auto
          description: Image detail level
          example: auto
    ContentBlock:
      type: object
      required:
      - type
      discriminator:
        propertyName: type
      oneOf:
      - type: object
        required:
        - type
        - text
        properties:
          type:
            type: string
            enum:
            - text
            description: Content type for text blocks
            example: text
          text:
            type: string
            description: Text content
            example: What do you see in this image?
        additionalProperties: false
      - type: object
        required:
        - type
        - image_url
        properties:
          type:
            type: string
            enum:
            - image_url
            description: Content type for image blocks
            example: image_url
          image_url:
            $ref: '#/components/schemas/ImageURLStruct'
            description: Image data
        additionalProperties: false
    FunctionCall:
      type: object
      required:
      - name
      - arguments
      properties:
        name:
          type: string
          description: Function name
          example: get_weather
        arguments:
          type: string
          description: JSON string of function arguments
          example: '{"location": "San Francisco, CA"}'
    Annotation:
      type: object
      required:
      - type
      - url_citation
      properties:
        type:
          type: string
          description: Annotation type
        url_citation:
          $ref: '#/components/schemas/Citation'
    BifrostMessage:
      type: object
      required:
      - role
      properties:
        role:
          $ref: '#/components/schemas/MessageRole'
        content:
          oneOf:
          - type: string
            description: Simple text content
            example: Hello, how are you?
          - type: array
            items:
              $ref: '#/components/schemas/ContentBlock'
            description: Structured content with text and images
          description: Message content - can be simple text or structured content with text and images
        tool_call_id:
          type: string
          description: ID of the tool call (for tool messages)
        tool_calls:
          type: array
          items:
            $ref: '#/components/schemas/ToolCall'
          description: Tool calls made by assistant
        refusal:
          type: string
          description: Refusal message from assistant
        annotations:
          type: array
          items:
            $ref: '#/components/schemas/Annotation'
          description: Message annotations
        thought:
          type: string
          description: Assistant's internal thought process
    ToolCall:
      type: object
      required:
      - function
      properties:
        id:
          type: string
          description: Unique tool call identifier
          example: tool_123
        type:
          type: string
          enum:
          - function
          description: Tool call type
          example: function
        function:
          $ref: '#/components/schemas/FunctionCall'
    MessageRole:
      type: string
      enum:
      - user
      - assistant
      - system
      - tool
      description: Role of the message sender
      example: user
    Citation:
      type: object
      required:
      - start_index
      - end_index
      - title
      properties:
        start_index:
          type: integer
          description: Start index in the text
        end_index:
          type: integer
          description: End index in the text
        title:
          type: string
          description: Citation title
        url:
          type: string
          description: Citation URL
        sources:
          description: Citation sources
        type:
          type: string
          description: Citation type
